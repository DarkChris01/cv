name: Integration

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    build-app:
        runs-on: ubuntu-latest
        
        steps:
            -   uses: actions/checkout@v4

            -   name: Use node.js 22
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: 'npm'
                
            - name: Install dependencies
              run: npm ci

            - name: Run app
              run: npm run build
